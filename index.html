<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AF問答帳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap');

  :root{
    --bg:#F6F2E9;
    --surface:#FFFFFF;
    --surface-2:#FBF8F1;
    --ink:#25231D;
    --muted:#8B8272;
    --primary:#1F4C42;
    --primary-ink:#F3F7F1;
    --accent:#B5622B;
    --accent-soft:#F1E1D2;
    --border:#E6DFCE;
    --danger:#9C3B2E;
    --shadow: 0 1px 2px rgba(37,35,29,.06), 0 8px 24px rgba(37,35,29,.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181A;
      --surface:#1B2124;
      --surface-2:#20272A;
      --ink:#EEEAE0;
      --muted:#9AA39C;
      --primary:#5DAE96;
      --primary-ink:#0D1513;
      --accent:#E39A63;
      --accent-soft:#2C241C;
      --border:#2B3336;
      --danger:#E08578;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .brand{ font-family:"Shippori Mincho", "Zen Old Mincho", serif; }

  header{
    flex:0 0 auto;
    padding: calc(14px + env(safe-area-inset-top,0px)) 16px 10px;
    background:var(--primary);
    color:var(--primary-ink);
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    position:sticky;
    top:0;
    z-index:20;
  }
  header .mark{
    width:34px;height:34px;border-radius:9px;
    background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  header .mark svg{width:19px;height:19px;stroke:var(--primary-ink);}
  header h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:.02em; }
  header p{ margin:1px 0 0; font-size:11.5px; opacity:.82; line-height:1.4; }
  header .headtext{min-width:0;flex:1 1 auto;}
  .src-toggle, .toggle-pill{
    flex:0 0 auto;
    background:rgba(255,255,255,.14);
    color:var(--primary-ink);
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    padding:7px 12px;
    font-size:11.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .toggle-pill[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); }
  .toggle-pill svg{width:13px;height:13px;flex:0 0 auto;}

  .notice{
    flex:0 0 auto;
    background:var(--accent-soft);
    color:var(--ink);
    border-bottom:1px solid var(--border);
    padding:9px 16px;
    font-size:11.5px;
    line-height:1.6;
    display:flex;
    gap:8px;
  }
  .notice b{color:var(--accent);}

  .layout{ flex:1 1 auto; min-height:0; display:flex; position:relative; }

  aside{
    width:280px;
    flex:0 0 auto;
    background:var(--surface-2);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  aside h2{
    font-family:"Shippori Mincho", serif;
    font-size:13px;
    margin:2px 2px 4px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.04em;
  }
  .note-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    box-shadow:var(--shadow);
  }
  .note-card.flash{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow); }
  .note-card .t{ font-weight:700; font-size:12.5px; line-height:1.45; margin:0 0 5px; }
  .note-card .meta{ font-size:10.5px; color:var(--muted); line-height:1.6; }
  .status-pill{
    display:inline-block; margin-top:6px; font-size:10px; padding:2px 8px;
    border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600;
  }
  .src-guideline{ font-size:10.5px; color:var(--muted); line-height:1.6; padding:2px 2px 0; }
  aside .close-side{ display:none; }

  main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0; }
  #thread{
    flex:1 1 auto; overflow-y:auto; padding:18px 16px 10px;
    display:flex; flex-direction:column; gap:16px;
  }
  .row{display:flex; gap:9px; max-width:720px;}
  .row.user{align-self:flex-end; flex-direction:row-reverse;}
  .avatar{
    flex:0 0 auto; width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700; margin-top:2px;
  }
  .row.assistant .avatar{background:var(--primary); color:var(--primary-ink);}
  .row.user .avatar{background:var(--border); color:var(--ink);}
  .bubble{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:11px 14px; font-size:13.5px; line-height:1.75; box-shadow:var(--shadow);
    white-space:pre-wrap;
  }
  .row.user .bubble{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  .row.example .bubble{border-style:dashed;}
  .example-tag{ font-size:10px; color:var(--muted); margin:0 0 4px; letter-spacing:.03em; }

  .msg-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:9px; }
  .cites{ display:flex; flex-wrap:wrap; gap:6px; }
  .cite-chip{
    font-size:10.5px; padding:3px 9px; border-radius:999px; background:var(--accent-soft);
    color:var(--accent); font-weight:700; border:none; cursor:pointer; font-family:inherit;
  }
  .cite-chip:active{filter:brightness(.95);}
  .no-source{
    display:inline-block; font-size:10.5px; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--border);
  }
  .speak-btn{
    flex:0 0 auto; width:25px;height:25px;border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer; padding:0;
  }
  .speak-btn svg{width:12px;height:12px;}
  .speak-btn.playing{
    background:var(--accent-soft); color:var(--accent); border-color:var(--accent);
    animation:pulse 1.4s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 var(--accent-soft);}
    50%{box-shadow:0 0 0 5px var(--accent-soft);}
  }
  @media (prefers-reduced-motion: reduce){ .speak-btn.playing, .mic-btn.listening{animation:none;} }

  .typing{ display:flex; gap:4px; padding:4px 2px; }
  .typing span{ width:5px;height:5px;border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  #composer{
    flex:0 0 auto; border-top:1px solid var(--border); background:var(--surface);
    padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; gap:8px; align-items:flex-end;
  }
  #composer textarea{
    flex:1 1 auto; resize:none; border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; font:inherit; font-size:13.5px; line-height:1.5;
    max-height:110px; min-height:42px; background:var(--surface-2); color:var(--ink);
  }
  #composer textarea:focus{ outline:none; border-color:var(--primary); }
  #send, .mic-btn{
    flex:0 0 auto; border-radius:12px; width:42px;height:42px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; border:none;
  }
  #send{ background:var(--primary); color:var(--primary-ink); }
  #send:disabled{opacity:.45; cursor:default;}
  #send svg{width:18px;height:18px;}
  .mic-btn{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }
  .mic-btn svg{width:18px;height:18px;}
  .mic-btn.listening{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); animation:pulse 1.4s infinite ease-in-out; }
  .mic-btn:disabled{opacity:.35; cursor:default;}

  .hint{ font-size:10.5px; color:var(--muted); padding:0 16px 8px; text-align:center; }
  .mic-error{ font-size:10.5px; color:var(--danger); padding:0 16px 8px; text-align:center; }
  .unavailable{
    margin:16px; padding:14px; border:1px solid var(--border); border-radius:10px;
    background:var(--surface-2); font-size:12.5px; line-height:1.7; color:var(--muted);
  }

  @media (max-width: 760px){
    aside{
      position:fixed; inset:0 18% 0 0; z-index:30;
      transform:translateX(-105%); transition:transform .22s ease; box-shadow:var(--shadow);
      padding-top:calc(14px + env(safe-area-inset-top,0px));
    }
    aside.open{transform:translateX(0);}
    aside .close-side{
      display:flex; align-items:center; justify-content:center; align-self:flex-start;
      background:var(--surface); border:1px solid var(--border); border-radius:999px;
      padding:6px 12px; font-size:11.5px; color:var(--ink); cursor:pointer; margin-bottom:2px;
    }
    .overlay{ display:none; position:fixed; inset:0; background:rgba(20,18,14,.35); z-index:25; }
    .overlay.show{display:block;}
    header h1{font-size:15.5px;}
    header p{font-size:10.5px;}
    header{flex-wrap:nowrap;}
    #autoReadLabel{display:none;}
    .toggle-pill{padding:8px;}
  }
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8.5c0-3-2.5-5-5-5-1.8 0-3.2 1-4 2.2C10.2 4.5 8.8 3.5 7 3.5c-2.5 0-5 2-5 5 0 6 9 11 9 11s9-5 9-11z"/><path d="M3 12.5h4l1.5-3 2 5 1.5-2.5h9"/></svg>
  </div>
  <div class="headtext">
    <h1 class="brand">AF問答帳</h1>
    <p>心房細動ノート4本のみを根拠に回答する試作アプリ</p>
  </div>
  <button class="toggle-pill" id="autoReadToggle" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <span id="autoReadLabel">自動読み上げ オフ</span>
  </button>
  <button class="src-toggle" id="toggleSrc" type="button">資料</button>
</header>

<div class="notice">
  <span><b>試作品：</b>基本は下の4つのノートに書いてある範囲で答えますが、ノートに無い場合はPubMed（実際の医学論文）も検索して答えることがあります。推測では答えません。ノート自体はAIが要約した下書きで、医師の最終確認前です。回答をそのまま診療に使わないでください。</span>
</div>

<div class="layout">
  <div class="overlay" id="overlay"></div>
  <aside id="sidebar">
    <button class="close-side" id="closeSrc" type="button">← 閉じる</button>
    <h2>根拠にしているノート</h2>
    <div id="noteList"></div>
    <h2 style="margin-top:6px;">出典ガイドライン</h2>
    <p class="src-guideline" id="guidelineInfo">読み込み中…</p>
  </aside>

  <main>
    <div id="thread"></div>
    <p class="hint" id="hint"></p>
    <p class="mic-error" id="micError" hidden></p>
    <div id="composer">
      <button id="micBtn" class="mic-btn" type="button" aria-label="音声入力" title="音声入力">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="例：CCr 20の患者にDOACは使える？"></textarea>
      <button id="send" type="button" aria-label="送信">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
(function(){
  var notesById = {};
  var notesArr = [];
  var thread = document.getElementById('thread');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var noteList = document.getElementById('noteList');
  var guidelineInfo = document.getElementById('guidelineInfo');
  var hint = document.getElementById('hint');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');

  document.getElementById('toggleSrc').addEventListener('click', function(){
    sidebar.classList.add('open'); overlay.classList.add('show');
  });
  document.getElementById('closeSrc').addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderNoteList(){
    noteList.innerHTML = '';
    notesArr.forEach(function(n){
      var card = document.createElement('div');
      card.className = 'note-card';
      card.id = 'card-' + n.id;
      card.innerHTML =
        '<p class="t">' + escapeHtml(n.title) + '</p>' +
        '<p class="meta">' + escapeHtml(n.chapter) + '　p.' + escapeHtml(n.pages) + '</p>' +
        '<span class="status-pill">未確認・下書き</span>';
      noteList.appendChild(card);
    });
    if(notesArr[0]){
      guidelineInfo.textContent = notesArr[0].guideline + '（' + notesArr[0].publisher + '、' + notesArr[0].edition + '）';
    }
  }

  function flashCard(id){
    sidebar.classList.add('open'); overlay.classList.add('show');
    var el = document.getElementById('card-' + id);
    if(!el) return;
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 1600);
  }

  function parseCitations(text){
    var re = /(AF-0[1-4])[^\d]{0,6}p\.?\s?([0-9]{1,3}(?:[–\-][0-9]{1,3})?)/g;
    var found = [], seen = {};
    var m;
    while((m = re.exec(text))){
      var key = m[1] + m[2];
      if(seen[key]) continue;
      seen[key] = true;
      found.push({id:m[1], page:m[2]});
    }
    return found;
  }

  // PubMed由来の出典（例: 「PubMed PMID 12345678」）を拾う
  function parsePubmedCitations(text){
    var re = /PMID[:\s]*([0-9]{4,9})/gi;
    var found = [], seen = {};
    var m;
    while((m = re.exec(text))){
      if(seen[m[1]]) continue;
      seen[m[1]] = true;
      found.push(m[1]);
    }
    return found;
  }

  function notesSuffix(shortId){
    for(var id in notesById){
      if(id.indexOf(shortId) === 0) return id.slice(shortId.length);
    }
    return '';
  }

  // ---------------- 読み上げ（ブラウザ標準の音声合成） ----------------
  var speechSupported = ('speechSynthesis' in window);
  var jaVoice = null;
  var autoRead = false;

  function loadAutoReadPref(){
    try{ return localStorage.getItem('af_autoread') === '1'; }catch(e){ return false; }
  }
  function saveAutoReadPref(v){
    try{ localStorage.setItem('af_autoread', v ? '1' : '0'); }catch(e){}
  }
  function pickVoice(){
    if(!speechSupported) return;
    var voices = window.speechSynthesis.getVoices() || [];
    jaVoice = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('ja') === 0; }) || null;
  }
  if(speechSupported){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function stripForSpeech(text){
    return text.split('\n').filter(function(line){ return !/^出典[:：]/.test(line.trim()); }).join('\n').trim();
  }
  function stopSpeaking(){
    if(speechSupported) window.speechSynthesis.cancel();
    document.querySelectorAll('.speak-btn.playing').forEach(function(b){ b.classList.remove('playing'); });
  }
  function speak(text, btn){
    if(!speechSupported) return;
    stopSpeaking();
    var spoken = stripForSpeech(text);
    if(!spoken) return;
    var utter = new SpeechSynthesisUtterance(spoken);
    utter.lang = 'ja-JP';
    if(jaVoice) utter.voice = jaVoice;
    utter.rate = 1.0;
    if(btn) btn.classList.add('playing');
    utter.onend = function(){ if(btn) btn.classList.remove('playing'); };
    utter.onerror = function(){ if(btn) btn.classList.remove('playing'); };
    window.speechSynthesis.speak(utter);
  }

  var autoReadBtn = document.getElementById('autoReadToggle');
  var autoReadLabel = document.getElementById('autoReadLabel');
  function renderAutoReadBtn(){
    autoReadBtn.setAttribute('aria-pressed', autoRead ? 'true' : 'false');
    autoReadLabel.textContent = '自動読み上げ ' + (autoRead ? 'オン' : 'オフ');
  }
  if(speechSupported){
    autoRead = loadAutoReadPref();
    renderAutoReadBtn();
    autoReadBtn.addEventListener('click', function(){
      autoRead = !autoRead;
      saveAutoReadPref(autoRead);
      renderAutoReadBtn();
      if(!autoRead) stopSpeaking();
    });
  }else{
    autoReadBtn.style.display = 'none';
  }

  // ---------------- メッセージ表示 ----------------
  function addRow(role, text, opts){
    opts = opts || {};
    var row = document.createElement('div');
    row.className = 'row ' + role + (opts.example ? ' example' : '');
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'Dr' : 'AF';
    var bubbleWrap = document.createElement('div');

    if(opts.example){
      var tag = document.createElement('p');
      tag.className = 'example-tag';
      tag.textContent = '例のやり取り';
      bubbleWrap.appendChild(tag);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    bubbleWrap.appendChild(bubble);

    var speakBtn = null;
    if(role === 'assistant' && !opts.pending){
      var cites = parseCitations(text);
      var actionsRow = document.createElement('div');
      actionsRow.className = 'msg-actions';
      var hasAction = false;

      if(speechSupported){
        speakBtn = document.createElement('button');
        speakBtn.type = 'button';
        speakBtn.className = 'speak-btn';
        speakBtn.setAttribute('aria-label', '読み上げる');
        speakBtn.title = '読み上げる';
        speakBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
        speakBtn.addEventListener('click', function(){
          if(speakBtn.classList.contains('playing')){ stopSpeaking(); }
          else{ speak(text, speakBtn); }
        });
        actionsRow.appendChild(speakBtn);
        hasAction = true;
      }

      var pubmedCites = opts.example ? [] : parsePubmedCitations(text);

      if(cites.length){
        var wrap = document.createElement('div');
        wrap.className = 'cites';
        cites.forEach(function(c){
          var b = document.createElement('button');
          b.className = 'cite-chip';
          b.type = 'button';
          b.textContent = c.id.replace('AF-0','AF-') + ' p.' + c.page;
          b.addEventListener('click', function(){ flashCard(c.id + notesSuffix(c.id)); });
          wrap.appendChild(b);
        });
        actionsRow.appendChild(wrap);
        hasAction = true;
      }

      if(pubmedCites.length){
        var pwrap = document.createElement('div');
        pwrap.className = 'cites';
        pubmedCites.forEach(function(pmid){
          var pb = document.createElement('button');
          pb.className = 'cite-chip';
          pb.type = 'button';
          pb.title = 'PubMedで開く（別タブ）';
          pb.textContent = 'PubMed ' + pmid;
          pb.addEventListener('click', function(){
            window.open('https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/', '_blank', 'noopener');
          });
          pwrap.appendChild(pb);
        });
        actionsRow.appendChild(pwrap);
        hasAction = true;
      }

      if(!cites.length && !pubmedCites.length && !opts.example){
        var tagEl = document.createElement('span');
        tagEl.className = 'no-source';
        tagEl.textContent = '出典の記載なし（ノート範囲外の可能性）';
        actionsRow.appendChild(tagEl);
        hasAction = true;
      }

      if(hasAction) bubbleWrap.appendChild(actionsRow);
    }

    row.appendChild(avatar);
    row.appendChild(bubbleWrap);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;

    if(role === 'assistant' && !opts.pending && opts.autoSpeak && speakBtn){
      setTimeout(function(){ speak(text, speakBtn); }, 50);
    }
    return bubble;
  }

  function addTyping(){
    var row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AF';
    var bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }
  function removeTyping(){
    var el = document.getElementById('typingRow');
    if(el) el.remove();
  }

  // ---------------- 音声入力（ブラウザ標準の音声認識） ----------------
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognitionSupported = !!SpeechRecognitionCtor;
  var recognition = null;
  var listening = false;
  var micBtn = document.getElementById('micBtn');
  var micError = document.getElementById('micError');

  function showMicError(msg){ micError.textContent = msg; micError.hidden = false; }
  function clearMicError(){ micError.hidden = true; micError.textContent = ''; }

  if(!recognitionSupported){
    micBtn.disabled = true;
    micBtn.title = 'この端末・ブラウザは音声入力に対応していません';
  }else{
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'ja-JP';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){ listening = true; micBtn.classList.add('listening'); clearMicError(); };
    recognition.onresult = function(e){
      var transcript = '';
      for(var i = 0; i < e.results.length; i++){ transcript += e.results[i][0].transcript; }
      input.value = transcript;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    };
    recognition.onerror = function(e){
      listening = false;
      micBtn.classList.remove('listening');
      var msg = '音声入力でエラーが起きました。キーボードで入力してください。';
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        msg = 'マイクの使用が許可されていません。ブラウザ側でマイクを許可するか、キーボードで入力してください。';
      }else if(e.error === 'no-speech'){
        msg = '声が聞き取れませんでした。もう一度🎤を押して話してください。';
      }else if(e.error === 'audio-capture'){
        msg = 'マイクが見つかりません。';
      }else if(e.error === 'network'){
        msg = '音声認識の通信でエラーが起きました。';
      }
      showMicError(msg);
    };
    recognition.onend = function(){ listening = false; micBtn.classList.remove('listening'); input.focus(); };

    micBtn.addEventListener('click', function(){
      if(listening){ recognition.stop(); return; }
      stopSpeaking();
      clearMicError();
      try{ recognition.start(); }catch(err){ showMicError('音声入力を開始できませんでした。'); }
    });
  }

  // ---------------- 送受信 ----------------
  var history = []; // {role:'user'|'assistant', content}
  var systemPrompt = '';

  function buildSystemPrompt(){
    var body = notesArr.map(function(n){
      return '----- ノートID: ' + n.id + '（表示名: ' + n.title.replace(/^心房細動/, '') + '） -----\n' +
        '出典ガイドライン: ' + n.guideline + '／' + n.publisher + '／' + n.edition + '\n' +
        '該当章: ' + n.chapter + '／本文ページ: ' + n.pages + '\n' +
        'ステータス: ' + n.status + '\n\n' + n.body;
    }).join('\n\n\n');

    return [
      'あなたは心房細動（AF）の臨床ノート専用アシスタントです。回答は以下に渡す「ノート」だけを根拠にしてください。',
      '厳守事項:',
      '1. ノートに書かれていないことは絶対に推測や一般知識で補わない。該当がなければ「このノートには載っていません」と明言する。',
      '2. 答えの中で使った数値・薬剤名・推奨クラス/エビデンスレベルは、ノートの記述と完全に一致させる。',
      '3. 回答の最後に、根拠にしたノートとページを必ず「出典: AF-01 (p.42)」のような形式で列挙する（複数可）。ノートを使わなかった場合は出典行を書かない。',
      '4. ノートの記述をコピーするのではなく、要点を整理して答えてよいが、数値や推奨クラスは変えない。',
      '5. 日本語で、医師向けに簡潔に。前置きの相槌は不要。',
      '6. これは試作品であり、各ノートはAIが要約した下書き（医師の最終確認前）であることを、必要に応じて一言添えてよい。',
      '',
      '=== ノート本文 ===',
      body
    ].join('\n');
  }

  function setSending(state){ sendBtn.disabled = state; input.disabled = state; }

  async function ask(question){
    history.push({role:'user', content: question});
    addTyping();
    setSending(true);
    try{
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({ system: systemPrompt, messages: history })
      });
      var data = await res.json();
      removeTyping();
      if(!res.ok){
        var errMsg = (data && data.message) ? data.message : '回答の取得中にエラーが起きました。';
        addRow('assistant', errMsg);
        history.pop();
        return;
      }
      var text = (data && data.text) ? data.text.trim() : '（回答を取得できませんでした）';
      history.push({role:'assistant', content:text});
      addRow('assistant', text, {autoSpeak: autoRead});
    }catch(err){
      removeTyping();
      addRow('assistant', '通信エラーが起きました。ネットワーク接続を確認してもう一度お試しください。');
      history.pop();
    }finally{
      setSending(false);
      input.focus();
    }
  }

  function handleSend(){
    var v = input.value.trim();
    if(!v || sendBtn.disabled) return;
    stopSpeaking();
    addRow('user', v);
    input.value = '';
    input.style.height = 'auto';
    ask(v);
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.shiftKey){ e.preventDefault(); handleSend(); }
  });
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });

  function seedExample(){
    addRow('user', 'CCr 20の心房細動患者にDOACは使える？', {example:true});
    addRow('assistant',
      '15≦CCr<30の重度腎機能障害では、ダビガトラン以外のDOACでの抗凝固療法を考慮する、という位置づけです（推奨クラスIIa・エビデンスレベルB）。J-ELD AFレジストリ（アピキサバン、75歳以上）では、この層の脳卒中/塞栓症発症率はCCr 50以上の群と同程度でした。\n\n出典: AF-02 (p.47), AF-02 (p.48)',
      {example:true});
  }

  async function init(){
    try{
      var res = await fetch('notes.json');
      notesArr = await res.json();
    }catch(e){
      notesArr = [];
    }
    notesArr.forEach(function(n){ notesById[n.id] = n; });
    renderNoteList();
    systemPrompt = buildSystemPrompt();
    seedExample();
    hint.textContent = '🎤で音声入力／Shift+Enterで送信・Enterで改行／回答横の🔈で読み上げ';
  }

  init();
})();
</script>
</body>
</html>
